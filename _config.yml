# _config.yml
# ============= CONFIGURAZIONE BASE =============
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "dark"
title: "Davide Orsucci"
name: "Davide Orsucci"
description: "Software Developer & Computer Science Student"
url: "https://dadeorsu.github.io"
baseurl: ""

# MASTHEAD (Titolo in alto)
masthead:
  enabled: true
  title: "Davide Orsucci"
  subtitle: "Software Developer"

# ============= AUTORE & SOCIAL =============
author:
  name: "Davide Orsucci"
  avatar: "https://github.com/dadeorsu.png?size=400"
  bio: "Software Developer passionate about coding and technology"
  location: "Italy"
  email: "dade.orsu@gmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/dadeorsu"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/davide-orsucci-206319250"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:dade.orsu@gmail.com"

# Social usernames
github_username: dadeorsu
linkedin_username: davide-orsucci-206319250
email: dade.orsu@gmail.com

# ============= IMPOSTAZIONI SITO =============
locale: "it-IT"
timezone: "Europe/Rome"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Impostazioni predefinite
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      nav: "main"
      layout: "single"
      author_profile: true
      share: true
      comments: false
      read_time: true
      toc: true
      toc_sticky: true


# ============= HEADER SETTINGS =============
header:
  overlay_image: "/assets/images/header-bg.jpg"  # Opzionale
  overlay_filter: 0.3
  actions:
    - label: "View Projects"
      url: "/projects/"
      btn_class: "btn--primary"
    - label: "Contact Me"
      url: "/contact/"
      btn_class: "btn--warning"

# ============= FOOTER =============
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/dadeorsu"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/davide-orsucci-206319250"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:dade.orsu@gmail.com"
  copyright: "© 2024 Davide Orsucci. All rights reserved."

# ============= PERSONALIZZAZIONI =============
# Avatar
avatar:
  path: "https://github.com/dadeorsu.png?size=400"
  class: "circle"

# Colori
colors:
  primary: "#005cc5"
  warning: "#ffd33d"

# Masthead settings
masthead:
  enabled: true
  title: "Davide Orsucci"
  subtitle: "Software Developer"

# ============= FEATURE SETTINGS =============
feature_rows:
  - frontmatter: true

# ============= COMMENTI =============
comments:
  provider: false

# ============= PAGINAZIONE =============
paginate: 5
paginate_path: "/page:num/"

# ============= BUILD SETTINGS =============
include:
  - _pages
  - _posts

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - LICENSE
  - README.md

# ============= MARKDOWN SETTINGS =============
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# ============= OUTPUT SETTINGS =============
output: true
permalink: pretty
